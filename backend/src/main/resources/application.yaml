server:
  port: 8082

spring:
  application:
    name: spring-boot-essentials-corte-sync
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
    max-file-size: 50MB
    max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
aws:
  region: us-east-1
  s3:
    bucket-name: ${AWS_BUCKET_NAME}
    access-key-id: fake-access-key
    secret-access-key: fake-access-key

jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_SECRET_KEY}